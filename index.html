<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhyMusic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tela" id="tela">
        <img id="capa-img" src="" alt="">
    </div>

    <div class="painel" id="painel">
        <div class="central-controle">
            <img class="central-overlay" src="overlay.png" alt="">

            <div class="capa-central">
                <video id="capa-principal-video" autoplay loop muted playsinline style="display:none;"></video>
                <img id="capa-principal-img" src="" alt="">
                <img id="capa-overlay" src="overlay.png" alt="">
            </div>

            <div class="info-musica">
                <h1 id="musica"></h1>
                <p id="artista"></p>
            </div>

            <div class="barra-progresso" id="barra-progresso">
                <div class="progresso-preenchido" id="progresso-preenchido"></div>
            </div>

            <div class="controles-player">
                <button class="controle-btn" id="btn-anterior" aria-label="Anterior">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="controle-btn play-pause" id="btn-play-pause" aria-label="Play/Pause">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="controle-btn" id="btn-proximo" aria-label="Próxima">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

            <div class="barra-volume">
                <i class="fa-solid fa-volume-low"></i>
                <input type="range" id="volume-slider" min="0" max="100" value="100">
                <i class="fa-solid fa-volume-high"></i>
            </div>

            <div class="acoes-player">
                <button class="acao-btn" id="btn-letras" aria-label="Letras">
                    <i class="fa-solid fa-microphone-lines"></i>
                </button>
                <button class="acao-btn" id="btn-equalizador" aria-label="Equalizador">
                    <i class="fa-solid fa-sliders"></i>
                </button>
                <button class="acao-btn" id="btn-fila" aria-label="Fila">
                    <i class="fa-solid fa-list"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="adesivos" id="adesivos"></div>

    <div class="assistive" id="assistive">
        <button class="assistive-btn" id="assistive-btn" aria-label="Menu"></button>
        <div class="assistive-menu" id="assistive-menu">
            <button class="assistive-opcao" id="opcao-pesquisar" aria-label="Pesquisar">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button class="assistive-opcao" id="opcao-stickers" aria-label="Importar imagem">
                <i class="fa-solid fa-image"></i>
            </button>
        </div>
    </div>

    <div class="modal-pesquisa" id="modal-pesquisa">
        <div class="modal-container">
            <div class="modal-topo">
                <button class="modal-voltar" id="modal-voltar" aria-label="Voltar">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="modal-conteudo">
                    <input type="text" id="input-busca" placeholder="Pesquisar música..." autocomplete="off">
                    <button id="btn-pesquisar-confirmar" aria-label="Confirmar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>
            <div class="resultados-busca" id="resultados-busca"></div>
        </div>
    </div>

    <input type="file" id="input-arquivo" accept="image/png,image/webp,image/gif,image/jpeg" style="display: none;">

    <div class="painel-galeria" id="painel-galeria">
        <div class="galeria-topo">
            <button class="galeria-upload" id="galeria-upload"><i class="fa-solid fa-plus"></i></button>
            <div class="galeria-lista" id="galeria-lista"></div>
        </div>
    </div>

    <button class="btn-fullscreen" id="btn-fullscreen" aria-label="Tela cheia">
        <i class="fa-solid fa-expand"></i>
    </button>

    <audio id="audio-player" style="display: none;"></audio>

    <script src="script.js"></script>
</body>
</html>
